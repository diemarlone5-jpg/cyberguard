<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard - Plateforme d'Analyse de Sécurité</title>
    <!-- Lien vers le fichier CSS corrigé -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Barre de navigation -->
    <nav class="navbar">
        <div class="brand">
            <div class="logo-icon">CG</div>
            <div class="brand-name">CYBER<span>GUARD</span></div>
        </div>
        <div class="status-badge">
            <div class="dot"></div>
            API operational
        </div>
    </nav>

    <!-- Conteneur principal -->
    <div class="main-wrapper">
        <div class="dashboard-header">
            <h1>Plateforme d'Analyse de Sécurité</h1>
            <p>Évaluez la robustesse de vos identifiants et vérifiez l'exposition aux fuites de données.</p>
        </div>

        <div class="grid-container">
            <!-- Carte 1 : Audit de Mot de Passe -->
            <div class="card">
                <div>
                    <div class="card-title">
                        <i class="fa-solid fa-key"></i> Audit de Mot de Passe
                    </div>
                    <div class="input-group">
                        <label for="password-input">Mot de passe à tester</label>
                        <input type="password" id="password-input" placeholder="Saisissez une chaîne de caractères">
                    </div>
                </div>
                <div>
                    <button id="btn-analyser">Analyser la sécurité</button>
                    <div id="result-audit" class="result-box" style="display: none;">
                        <!-- Les résultats s'afficheront ici -->
                    </div>
                </div>
            </div>

            <!-- Carte 2 : Surveillance des Fuites E-mail -->
            <div class="card">
                <div>
                    <div class="card-title">
                        <i class="fa-solid fa-shield-halved"></i> Surveillance des Fuites E-mail
                    </div>
                    <div class="input-group">
                        <label for="email-input">Adresse e-mail professionnelle</label>
                        <input type="email" id="email-input" placeholder="nom@entreprise.com">
                    </div>
                </div>
                <div>
                    <button id="btn-email">Lancer l'investigation</button>
                    <div id="result-email" class="result-box" style="display: none;">
                        <!-- Les résultats s'afficheront ici -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script src="/static/script.js"></script>
</body>
</html>
