<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard - Plateforme d'Analyse de Sécurité</title>
    <!-- Lien vers le CSS -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Barre de navigation -->
    <nav class="navbar">
        <div class="brand">
            <div class="logo-icon">CG</div>
            <div class="brand-name">CYBER<span>GUARD</span></div>
        </div>
        <div class="status-badge">
            <div class="dot"></div>
            API operational
        </div>
    </nav>

    <!-- Conteneur principal -->
    <div class="main-wrapper">
        <div class="dashboard-header">
            <h1>Plateforme d'Analyse de Sécurité</h1>
            <p>Évaluez la robustesse de vos identifiants et vérifiez l'exposition aux fuites de données.</p>
        </div>

        <div class="grid-container">
            <!-- Carte 1 : Audit de Mot de Passe -->
            <div class="card">
                <div>
                    <div class="card-title">
                        <i class="fa-solid fa-key"></i> Audit de Mot de Passe
                    </div>
                    <div class="input-group">
                        <label for="password-input">Mot de passe à tester</label>
                        <input type="password" id="password-input" placeholder="Saisissez une chaîne de caractères">
                    </div>
                </div>
                <div>
                    <button type="button" id="btn-analyser">Analyser la sécurité</button>
                    <div id="result-audit" class="result-box" style="display: none;"></div>
                </div>
            </div>

            <!-- Carte 2 : Surveillance des Fuites E-mail -->
            <div class="card">
                <div>
                    <div class="card-title">
                        <i class="fa-solid fa-shield-halved"></i> Surveillance des Fuites E-mail
                    </div>
                    <div class="input-group">
                        <label for="email-input">Adresse e-mail professionnelle</label>
                        <input type="email" id="email-input" placeholder="nom@entreprise.com">
                    </div>
                </div>
                <div>
                    <button type="button" id="btn-email">Lancer l'investigation</button>
                    <div id="result-email" class="result-box" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript intégré directement pour garantir son exécution -->
    <script>
        console.log("Script interne CyberGuard chargé !");

        // 1. Audit de Mot de Passe
        document.getElementById("btn-analyser").addEventListener("click", async () => {
            const passwordInput = document.getElementById("password-input");
            const resultAudit = document.getElementById("result-audit");
            const password = passwordInput.value;

            if (!password) {
                alert("Veuillez saisir un mot de passe à tester.");
                return;
            }

            try {
                const response = await fetch('/api/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });

                const data = await response.json();
                resultAudit.style.display = "block";
                
                if (response.ok) {
                    resultAudit.innerHTML = `<strong>Résultat :</strong> ${data.message} <br><strong>Score :</strong> ${data.score} / 4`;
                } else {
                    resultAudit.innerHTML = `<span style="color: #EF4444;">Erreur : ${data.detail || "Impossible d'analyser"}</span>`;
                }
            } catch (error) {
                console.error("Erreur réseau :", error);
                resultAudit.style.display = "block";
                resultAudit.innerHTML = `<span style="color: #EF4444;">❌ Impossible de joindre le serveur.</span>`;
            }
        });

        // 2. Fuite E-mail
        document.getElementById("btn-email").addEventListener("click", async () => {
            const emailInput = document.getElementById("email-input");
            const resultEmail = document.getElementById("result-email");
            const email = emailInput.value;

            if (!email) {
                alert("Veuillez saisir une adresse e-mail.");
                return;
            }

            try {
                const response = await fetch('/api/breach', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();
                resultEmail.style.display = "block";
                
                if (response.ok) {
                    resultEmail.innerHTML = `<strong>Investigation :</strong> ${data.message}`;
                } else {
                    resultEmail.innerHTML = `<span style="color: #EF4444;">Erreur : ${data.detail || "Investigation impossible"}</span>`;
                }
            } catch (error) {
                console.error("Erreur réseau :", error);
                resultEmail.style.display = "block";
                resultEmail.innerHTML = `<span style="color: #EF4444;">❌ Impossible de joindre le serveur.</span>`;
            }
        });
    </script>
</body>
</html>
